name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue commits: the required jobs must report on the
  # gh-readonly-queue/main/* commit or a merge queue never merges it.
  merge_group:
    types: [checks_requested]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make lint

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make coverage
      # Not on pushes to main: there it would only re-run flakes after merge.
      - name: Per-test speed guard
        if: github.event_name != 'push'
        run: make test_speed_check

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make security
